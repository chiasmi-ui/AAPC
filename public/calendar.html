<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Calendar — AAPC</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=DM+Sans:wght@400;500;600;700;800&family=Lora:ital@0;1&family=Pinyon+Script&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calendar">
  <main>
    <section class="container page-hero">
      <span class="script">What&#39;s on</span>
      <h1>Event Calendar</h1>
      <p>GBMs, collabs, deadlines and magazine drops.</p>
    </section>
    <section class="container">
      <div class="card cal-wrap">
        <div class="cal-head">
          <button class="btn ghost" id="cal-prev" aria-label="Previous month">‹</button>
          <h2 id="cal-title"></h2>
          <button class="btn ghost" id="cal-next" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="legend"><span class="chip pink">GBM</span><span class="chip gold">Deadline</span><span class="chip">Tabling / other</span><span class="chip" style="background:var(--forest);color:#fff">Release</span></div>
      </div>
      <div class="event-list" id="event-list"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/calendar.js"></script>
</body>
</html>
