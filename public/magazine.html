<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Magazine | AAPC</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=DM+Sans:wght@400;500;600;700;800&family=Lora:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="magazine">
  <main>
    <section class="container page-hero">
      <h1>AAPC Magazine</h1>
      <span class="script coming-soon">Information coming soon....</span>
      <p>In the meantime, you can <a href="previous-years.html">read Volume 1 (2025–2026)</a>.</p>
    </section>
    <section class="container">
      <div class="card suggestion-box">
        <h2>What should we add?</h2>
        <p class="muted">What would you like to see in the magazine? Themes, sections, formats, anything goes.</p>
        <form class="form" id="suggestion-form" novalidate>
          <label>Your suggestion<textarea name="suggestion" required placeholder="I'd love to see…"></textarea></label>
          <label>Name (optional)<input name="name" autocomplete="name"></label>
          <label>Email (optional, if you'd like a reply)<input name="email" type="email" autocomplete="email"></label>
          <button class="btn pink" type="submit">Send suggestion</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/magazine.js"></script>
</body>
</html>
