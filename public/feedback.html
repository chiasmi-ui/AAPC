<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback — AAPC</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=DM+Sans:wght@400;500;600;700;800&family=Lora:ital@0;1&family=Pinyon+Script&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="feedback">
  <main>
    <section class="container page-hero">
      <span class="script">We&#39;re listening</span>
      <h1>Feedback &amp; Requests</h1>
      <p>Tell us how GBMs and club activities are going, or request a topic you want the magazine to cover.</p>
    </section>
    <section class="container two-col">
      <div class="card tape">
        <h2>General Feedback</h2>
        <form class="form" id="feedback-form" novalidate>
          <label>What is this about?
            <select name="category"><option>General</option><option>GBMs &amp; events</option><option>The magazine</option><option>Website</option><option>Other</option></select>
          </label>
          <div><span style="font:600 .9rem var(--sans);color:var(--forest)">How are we doing?</span><div class="stars" id="stars"></div></div>
          <label>Your feedback<textarea name="message" required placeholder="What did you love? What could be better?"></textarea></label>
          <label>Name (optional)<input name="name" autocomplete="name"></label>
          <label>Email (optional, if you want a reply)<input name="email" type="email" autocomplete="email"></label>
          <button class="btn" type="submit">Send feedback</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
      <div class="card tape pink" id="request">
        <h2>Request an Article Topic</h2>
        <form class="form" id="topic-form" novalidate>
          <label>Topic you want covered<input name="topic" required placeholder="e.g. Growing up bilingual"></label>
          <label>Category
            <select name="category"><option>Culture</option><option>Identity</option><option>Food</option><option>Arts</option><option>Activism &amp; Advocacy</option><option>Fashion</option><option>Community</option><option>Other</option></select>
          </label>
          <label>More details (optional)<textarea name="details" placeholder="Angles, questions, people to interview…"></textarea></label>
          <label>Name (optional)<input name="name" autocomplete="name"></label>
          <button class="btn pink" type="submit">Submit request</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/pages/feedback.js"></script>
</body>
</html>
