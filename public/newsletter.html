<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter | AAPC</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=DM+Sans:wght@400;500;600;700;800&family=Lora:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="newsletter">
  <main>
    <section class="container">
      <div class="card newsletter-solo">
        <span class="logo" role="img" aria-label="AAPC lotus logo"></span>
        <h1>Join the newsletter</h1>
        <p class="muted">Leave your email and we&#39;ll send you new articles, magazine releases and GBM dates.</p>
        <form class="form" id="newsletter-solo" novalidate>
          <div class="inline-form">
            <label class="visually-hidden" for="solo-email">Email</label>
            <input id="solo-email" name="email" type="email" placeholder="you@udel.edu" required>
            <button class="btn" type="submit">Sign me up</button>
          </div>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/newsletter.js"></script>
</body>
</html>
